baseURL = "https://example.com/"
title = "FastComments + Hugo"

# Consume the theme as a classic theme component (themes/fastcomments-hugo is a
# symlink to the repo root). This keeps the demo build dependency-free: just the
# hugo binary, no Go toolchain. Consumers can still use the Hugo Module install
# path (see the README); that is independent of how this exampleSite builds.
theme = "fastcomments-hugo"

# Collab/image chat demo pages embed raw <div>/<img> targets in Markdown.
[markup.goldmark.renderer]
  unsafe = true

# Site-wide FastComments config. The public "demo" tenant is open for testing.
# Per-page front matter under [fastcomments] overrides anything here.
[params.fastcomments]
  tenantId = "demo"
