baseURL = "https://example.com/"
title = "FastComments + Hugo"

# Use the local copy of the theme (one directory up) via a Go module replacement,
# so `hugo server` here builds against the templates you are editing.
[module]
  [[module.imports]]
    path = "github.com/FastComments/fastcomments-hugo"

# Collab/image chat demo pages embed raw <div>/<img> targets in Markdown.
[markup.goldmark.renderer]
  unsafe = true

# Site-wide FastComments config. The public "demo" tenant is open for testing.
# Per-page front matter under [fastcomments] overrides anything here.
[params.fastcomments]
  tenantId = "demo"
