baseURL = "https://example.com/"
title = "FastComments + Hugo"

# Consume the theme as a Hugo Module. exampleSite/go.mod has a `replace` pointing
# at the repo root, so this builds the local theme (the aggregator clones the repo
# and builds in place). Requires the go binary on the build host.
[module]
  [[module.imports]]
    path = "github.com/FastComments/fastcomments-hugo"

# Collab/image chat demo pages embed raw <div>/<img> targets in Markdown.
[markup.goldmark.renderer]
  unsafe = true

# Site-wide FastComments config. The public "demo" tenant is open for testing.
# Per-page front matter under [fastcomments] overrides anything here.
[params.fastcomments]
  tenantId = "demo"
